{% extends 'base.html' %}

{% block titulo %}Excluir assinatura - SubTracker{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card p-4">
            <h1 class="h4 mb-3">Excluir assinatura</h1>
            <p>Tem certeza que deseja excluir a assinatura <strong>{{ assinatura.nome_servico }}</strong>? Essa ação não pode ser desfeita.</p>

            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sim, excluir</button>
                <a href="{% url 'listar_assinaturas' %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
